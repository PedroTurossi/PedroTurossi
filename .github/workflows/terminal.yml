name: terminal

# Collects GitHub telemetry for the `username` in config.json and redraws
# assets/terminal.svg. Python only, no dependencies to install.

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    paths:
      - config.json
      - scripts/**
      - assets/strings.json
      - assets/fonts/**
      - assets/logos/**
      - .github/workflows/terminal.yml

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect telemetry (repos, commits, followers, views, top languages)
        run: python scripts/telemetry.py
        env:
          # github.token reads public data. Create a TERMINAL_TOKEN secret (a PAT)
          # only if you want private repositories/contributions counted.
          GH_TOKEN: ${{ secrets.TERMINAL_READONLY_TOKEN || github.token }}

      - name: Render assets/terminal.svg
        run: python scripts/render.py

      - name: Publish
        run: |
          git add assets/terminal.svg data/telemetry.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
      
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git commit -m "chore(terminal): sync telemetry"
      
          git fetch origin main
          git rebase origin/main || {
            git checkout --theirs assets/terminal.svg data/telemetry.json
            git add assets/terminal.svg data/telemetry.json
            GIT_EDITOR=true git rebase --continue
          }
      
          git push origin main
